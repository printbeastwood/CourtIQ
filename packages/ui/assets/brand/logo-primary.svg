<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- CourtIQ Primary Logo (Horizontal) -->
  <!-- Icon mark: stylised padel court + smart "spark" -->
  <g transform="translate(0,4)">
    <!-- Court shape - rounded square -->
    <rect x="2" y="2" width="52" height="52" rx="12" fill="#2563EB"/>
    <!-- Court centre line -->
    <line x1="28" y1="10" x2="28" y2="46" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Court service boxes -->
    <rect x="10" y="14" width="36" height="28" rx="4" stroke="white" stroke-width="1.5" fill="none" opacity="0.35"/>
    <!-- Smart spark / IQ dot -->
    <circle cx="42" cy="14" r="5" fill="#60A5FA"/>
    <circle cx="42" cy="14" r="2.5" fill="white"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(68, 8)">
    <!-- "Court" in medium weight -->
    <text x="0" y="38" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#0F172A" letter-spacing="-0.5">Court</text>
    <!-- "IQ" in bold brand blue -->
    <text x="116" y="38" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#2563EB" letter-spacing="-0.5">IQ</text>
  </g>
</svg>
